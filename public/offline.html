<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="robots" content="noindex" />
  <title>7FX is offline</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #07090d; color: #f4f7fb; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
    }
    main {
      box-sizing: border-box;
      min-height: 100dvh;
      max-width: 28rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding:
        max(28px, env(safe-area-inset-top, 0px))
        max(20px, env(safe-area-inset-right, 0px))
        max(28px, env(safe-area-inset-bottom, 0px))
        max(20px, env(safe-area-inset-left, 0px));
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    p.kicker {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9aa3b5;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    p.body { margin: 0 0 22px; color: #9aa3b5; font-size: 16px; line-height: 1.55; }
    button {
      align-self: flex-start;
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: #f4f7fb;
      color: #0b0e13;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
    }
    html:not([lang="tr"]) .tr { display: none; }
    html[lang="tr"] .en { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/icons/v3/apple-touch-icon.png" alt="" width="56" height="56" />
    <p class="kicker en">7FX</p>
    <h1 class="en">You're offline</h1>
    <p class="body en">The terminal needs a connection. Check the network, then try again. No order was sent.</p>
    <p class="kicker tr">7FX</p>
    <h1 class="tr">Çevrimdışısınız</h1>
    <p class="body tr">Terminal bir bağlantı ister. Ağı kontrol edip yeniden deneyin. Emir gönderilmedi.</p>
    <button type="button" class="en" onclick="location.reload()">Try again</button>
    <button type="button" class="tr" onclick="location.reload()">Yeniden dene</button>
  </main>
  <script>
    try {
      var stored = localStorage.getItem("fx_lang") || "";
      var nav = (navigator.language || "");
      if (/^tr\b/i.test(stored) || (!stored && /^tr\b/i.test(nav))) {
        document.documentElement.lang = "tr";
        document.title = "7FX çevrimdışı";
      }
    } catch (e) {}
  </script>
</body>
</html>
